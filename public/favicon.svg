<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Blue Glow Container -->
  <rect x="76" y="76" width="360" height="360" rx="88" fill="url(#blueGrad)" filter="url(#glow)" />

  <!-- Camera Top Flash Element -->
  <rect x="206" y="140" width="100" height="32" rx="12" fill="#ffffff" />
  
  <!-- Camera Body -->
  <rect x="136" y="166" width="240" height="170" rx="36" fill="#ffffff" />

  <!-- Camera Lens Outer Ring -->
  <circle cx="256" cy="254" r="62" fill="url(#lensGrad)" />
  <!-- Camera Lens Middle Ring -->
  <circle cx="256" cy="254" r="46" fill="#2563eb" opacity="0.3" stroke="#60a5fa" stroke-width="6" />
  <!-- Camera Lens Center Glass -->
  <circle cx="256" cy="254" r="28" fill="#1e1b4b" />
  <circle cx="266" cy="244" r="9" fill="#93c5fd" opacity="0.8" />

  <!-- Flash Light / Indicator Dot -->
  <circle cx="334" cy="204" r="10" fill="#38bdf8" />

  <!-- SevenCloud Accent Wave / Cloud Base -->
  <path d="M190 380 Q 256 360 322 380" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.75" />
</svg>
